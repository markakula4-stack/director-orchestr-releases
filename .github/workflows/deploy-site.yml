name: Deploy site to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'releases/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: director-orchestr-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout source and verified APK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate website and release publishing
        run: |
          node scripts/validate-site.mjs
          node --test scripts/publish-release.test.mjs
      - name: Publish verified preview APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs

  deploy:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate website
        run: node scripts/validate-site.mjs

      - name: Check Cloudflare access and prepare deployment
        id: prepare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-deploy.mjs

      - name: Publish to the existing Cloudflare project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_BRANCH: ${{ steps.prepare.outputs.production_branch }}
        run: npx --yes wrangler@4.128.0 pages deploy site --project-name=director-orchestr --branch="$PRODUCTION_BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true

      - name: Verify the live website and APK
        run: node scripts/verify-deployment.mjs

